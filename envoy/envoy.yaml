# ─────────────────────────────────────────────────────────────
# Envoy L4/L7 Load Balancer Configuration
# Ingestion Entry Point for the IDOP Ingestion Layer
# ─────────────────────────────────────────────────────────────
static_resources:
  listeners:
    # gRPC / HTTP2 ingestion listener
    - name: ingestion_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      # Per-listener connection limit — prevents resource exhaustion (DoS mitigation)
      per_connection_buffer_limit_bytes: 1048576   # 1 MiB
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingestion_http
                codec_type: AUTO
                # Limit request headers to 64 KiB to prevent header-flood attacks
                max_request_headers_kb: 64
                # Stream idle timeout — close streams that stall
                stream_idle_timeout: 300s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: vector_aggregator
                      domains: ["*"]
                      # Virtual-host-level retry policy (inherited by all routes)
                      retry_policy:
                        retry_on: "connect-failure,unavailable,resource-exhausted"
                        num_retries: 3
                        per_try_timeout: 10s
                      routes:
                        # OTLP gRPC route
                        - match:
                            prefix: "/opentelemetry.proto.collector"
                          route:
                            cluster: vector_aggregator_grpc
                            timeout: 30s
                        # Health check route (passthrough to Vector)
                        - match:
                            prefix: "/health"
                          route:
                            cluster: vector_aggregator_health
                            timeout: 5s
                        # Default route to Vector HTTP
                        - match:
                            prefix: "/"
                          route:
                            cluster: vector_aggregator_http
                            timeout: 30s
                http_filters:
                  # Envoy-native health check — returns 200 without hitting upstream
                  - name: envoy.filters.http.health_check
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                      pass_through_mode: false
                      headers:
                        - name: ":path"
                          string_match:
                            exact: "/envoy-health"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ── Cluster 1: Vector Aggregator gRPC (OTLP receiver) ──
    - name: vector_aggregator_grpc
      type: STRICT_DNS
      connect_timeout: 5s                           # <-- was missing
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: vector_aggregator_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: vector-aggregator
                      port_value: 4317
      # Active health check on the gRPC port
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          tcp_health_check: {}
      # Circuit breaker — cap concurrent connections & requests
      circuit_breakers:
        thresholds:
          - max_connections: 1024
            max_pending_requests: 1024
            max_requests: 1024

    # ── Cluster 2: Vector Aggregator HTTP (structured JSON) ──
    - name: vector_aggregator_http
      type: STRICT_DNS
      connect_timeout: 5s                           # <-- was missing
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: vector_aggregator_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: vector-aggregator
                      port_value: 8687               # FIX: was 8686 (Vector API) — must be 8687 (HTTP JSON ingest)
      # Active health check — was missing entirely
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          tcp_health_check: {}
      circuit_breakers:
        thresholds:
          - max_connections: 1024
            max_pending_requests: 1024
            max_requests: 1024

    # ── Cluster 3: Vector Aggregator health endpoint ──
    - name: vector_aggregator_health
      type: STRICT_DNS
      connect_timeout: 5s                           # <-- was missing
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: vector_aggregator_health
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: vector-aggregator
                      port_value: 8686               # FIX: was 8687 (HTTP source) — must be 8686 (Vector API /health)
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          tcp_health_check: {}

# Admin interface — 0.0.0.0 inside container is safe (Docker network isolation).
# In production, do NOT expose port 9901 to the host or use a network policy.
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
