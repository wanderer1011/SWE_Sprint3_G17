apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus                          # FIX: explicit UID so dashboard panels can reference it
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse                          # FIX: explicit UID for dashboard references
    access: proxy
    url: http://clickhouse:8123
    jsonData:
      defaultDatabase: telemetry
      port: 8123
      protocol: http
      username: grafana_reader
    secureJsonData:
      password: grafana_readonly_pass
    editable: false
